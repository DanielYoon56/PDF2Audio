<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PaperAudio — PDF 논문·리포트 오디오북 변환 데모</title>
    <meta name="description" content="PDF 논문과 리포트를 Gemini AI로 자연스러운 한국어 낭독 대본으로 변환하고 즉시 들어볼 수 있는 오디오북 데모 웹앱입니다." />
    <meta property="og:title" content="PaperAudio — PDF 논문·리포트 오디오북 변환 데모" />
    <meta property="og:description" content="PDF 논문과 리포트를 Gemini AI로 자연스러운 한국어 낭독 대본으로 변환하고 즉시 들어볼 수 있는 오디오북 데모 웹앱입니다." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('paperaudio_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F8FAFC] dark:bg-[#0B1120] text-slate-900 dark:text-slate-100 antialiased transition-colors duration-300 selection:bg-blue-200 selection:text-blue-950 dark:selection:bg-blue-500/35 dark:selection:text-blue-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
